# Managed by /opt/isp/zabbix/add_server_monitoring.py - local checks of the monitoring server itself.
UserParameter=pidc.ntp.synced,timedatectl show -p NTPSynchronized --value
UserParameter=pidc.apt.updates,/usr/lib/update-notifier/apt-check 2>&1
UserParameter=pidc.db.tables,mysql --defaults-file=/etc/zabbix/pidc-mysql-monitor.cnf -N -B -e "SELECT JSON_OBJECTAGG(table_name, data_length + index_length) FROM information_schema.tables WHERE table_schema = 'zabbix' AND table_name IN ('history', 'history_uint', 'history_str', 'history_text', 'history_log', 'trends', 'trends_uint', 'events', 'event_recovery', 'problem', 'alerts', 'auditlog')"
UserParameter=pidc.alerts,mysql --defaults-file=/etc/zabbix/pidc-mysql-monitor.cnf -N -B -e "SELECT JSON_OBJECT('failed', COALESCE(SUM(status = 2 AND clock > UNIX_TIMESTAMP() - 3600), 0), 'stuck', COALESCE(SUM(status IN (0, 3) AND clock < UNIX_TIMESTAMP() - 600), 0), 'sent', COALESCE(SUM(status = 1 AND clock > UNIX_TIMESTAMP() - 3600), 0)) FROM zabbix.alerts WHERE clock > UNIX_TIMESTAMP() - 86400 AND alerttype = 0"
