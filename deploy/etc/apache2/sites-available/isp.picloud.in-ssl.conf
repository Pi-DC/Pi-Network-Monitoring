<VirtualHost *:443>
    ServerName isp.picloud.in
    ServerAlias 172.20.119.99
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/isp.picloud.in/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/isp.picloud.in/privkey.pem
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"

    # Landing page -> Zabbix
    RedirectMatch 302 ^/$ /zabbix/

    ErrorLog ${APACHE_LOG_DIR}/isp-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/isp-ssl-access.log combined
</VirtualHost>
