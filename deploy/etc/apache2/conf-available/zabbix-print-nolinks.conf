# Remove clickable links from Zabbix's dashboard print view (the page turned into PDFs by zabbix-web-service),
# see /opt/isp/reports/print-nolinks.js. Kept outside /usr/share/zabbix so package upgrades don't undo it.
<Location "/zabbix/zabbix.php">
    <If "%{QUERY_STRING} =~ /(^|&)action=dashboard\.print(&|$)/">
        AddOutputFilterByType SUBSTITUTE text/html
        Substitute "s|</head>|<script src=\"/reports/print-nolinks.js\"></script></head>|i"
    </If>
</Location>
