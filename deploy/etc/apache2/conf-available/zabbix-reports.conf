# Zabbix report downloader (/opt/isp/reports). Users log in with their Zabbix account inside the page.
Alias /reports /opt/isp/reports

<Directory "/opt/isp/reports">
    Require all granted
    DirectoryIndex index.php
    Options -Indexes
    <IfModule mod_php.c>
        php_value max_execution_time 300
    </IfModule>
</Directory>
