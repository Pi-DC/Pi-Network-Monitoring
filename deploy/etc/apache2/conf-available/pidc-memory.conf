# Memory safety for the 24 GB monitoring VM (2026-10-09). Each PHP worker may use up to 512 MB (Zabbix frontend)
# or 2 GB (/reports), so 150 workers (prefork default) could ask for far more than the VM has. 40 is plenty for
# this tool; workers are recycled after 1000 requests so PHP memory never accumulates. Hard cap: systemd
# drop-in /etc/systemd/system/apache2.service.d/memory.conf.
<IfModule mpm_prefork_module>
    MaxRequestWorkers       40
    MaxConnectionsPerChild  1000
</IfModule>
